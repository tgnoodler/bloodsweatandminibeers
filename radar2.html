<style>

  background:conic-gradient(from 0deg,#0000 0deg,#0000 298deg,color-mix(in srgb,var(--phos) 35%,transparent) 358.5deg,color-mix(in srgb,var(--phos) 45%,transparent) 360deg);animation:sw var(--sweep,4s) linear infinite;will-change:transform}
