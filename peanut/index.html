function h2b(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function open(word,remember){
  var enc=new TextEncoder();
  word=String(word||'').toLowerCase().replace(/\s+/g,'');
  return crypto.subtle.importKey('raw',enc.encode(word),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:h2b(SALT),iterations:200000},k,384);
  }).then(function(bits){
    return crypto.subtle.digest('SHA-256',bits).then(function(d){
      if(hex(d).slice(0,16)!==CHECK)throw new Error('word');
      var kb=new Uint8Array(bits);
      return crypto.subtle.importKey('raw',kb.slice(0,32),{name:'AES-CBC'},false,['decrypt']).then(function(key){return crypto.subtle.decrypt({name:'AES-CBC',iv:kb.slice(32,48)},key,b64(BLOB));});
    });
  }).then(function(plain){
    if(remember){try{localStorage.setItem('peanut:word',word);}catch(e){}}
    var html=new TextDecoder().decode(plain);document.open();document.write(html);document.close();
  });
}
document.getElementById('d').addEventListener('submit',function(ev){ev.preventDefault();E.textContent='';open(W.value,true).catch(function(){E.textContent='Not it.';W.select();});});
var saved='';try{saved=localStorage.getItem('peanut:word')||'';}catch(e){}
if(saved)open(saved,false).catch(function(){W.focus();});else W.focus();
})();
</script></body></html>
