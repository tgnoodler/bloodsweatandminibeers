# Writes the Scoreboard's Rundown while games are on: touchdowns, starters at zero, Ices, lead changes.
# GitHub starts scheduled runs hours late, so this does not rely on the schedule alone. A run that finds a kickoff
# within 16 hours stays up, watches the games, and starts its own replacement before GitHub's six-hour limit.
# It is started three ways: on the schedule below, by the Scoreboard week job, and whenever the home computer
# pushes a build. Only the oldest run keeps the watch; any other steps aside in a few seconds.
# See scoreboard/live.py.
name: Scoreboard live
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths: ['radar_status.json']
  workflow_dispatch:
    inputs:
      takeover:
        description: 'Set to 1 when one run hands over to the next'
        required: false
        default: ''
      max_seconds:
        description: 'For testing: hand over after this many seconds instead of 5 hours 15 minutes'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scoreboard/live.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAKEOVER: ${{ inputs.takeover }}
          LIVE_MAX_SECONDS: ${{ inputs.max_seconds }}
