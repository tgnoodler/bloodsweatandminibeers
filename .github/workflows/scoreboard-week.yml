# Keeps the Scoreboard on the right week. If sunday.html and index.html are still built for last week when this
# week's first game is about to kick off, this rebuilds their week data from Sleeper. It stands down when the
# regular build has already done it. Runs on its own; "Run workflow" on the Actions tab forces a check.
name: Scoreboard week
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: scoreboard-week
jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scoreboard/roll.py
      - run: |
          if ! git diff --quiet -- sunday.html index.html wire.json; then
            git config user.name "scoreboard"
            git config user.email "scoreboard@users.noreply.github.com"
            git add sunday.html index.html wire.json
            git commit -m "Scoreboard week roll"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
