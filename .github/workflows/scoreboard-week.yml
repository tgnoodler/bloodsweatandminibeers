# Builds the cloud Scoreboard page (scoreboard.html) and keeps the home page's scoreboard on the right week.
# It moves both to the new week 12 hours before its first kickoff, refreshes them when rosters or kickoff times
# change, and keeps every Scoreboard link pointed at the live page. See scoreboard/build.py.
# Runs on its own; "Run workflow" on the Actions tab forces a check.
name: Scoreboard week
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: scoreboard-week
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scoreboard/build.py
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "scoreboard"
            git config user.email "scoreboard@users.noreply.github.com"
            git add -A
            git commit -q -m "Scoreboard week roll"
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      # GitHub's schedule is slow to start things, so every job that does run also makes sure the live watch is up.
      - run: |
          curl -s -o /dev/null -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/scoreboard-live.yml/dispatches" -d '{"ref":"main"}' || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
